name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 1. Windows용 빌드 및 폴더 전체 압축
      - name: Build Windows
        run: |
          dotnet publish PortableObsidian/PortableObsidian.csproj -c Release -r win-x64 -o ./win-publish -p:PublishSingleFile=true -p:SelfContained=true
          cd win-publish
          zip -r ../PortableObsidian_Windows.zip . *
          cd ..

      # 2. Linux용 빌드 및 폴더 전체 압축
      - name: Build Linux
        run: |
          dotnet publish PortableObsidian/PortableObsidian.csproj -c Release -r linux-x64 -o ./linux-publish -p:PublishSingleFile=true -p:SelfContained=true
          cd linux-publish
          zip -r ../PortableObsidian_Linux.zip . *
          cd ..

      # 3. GitHub Release 생성 및 파일 업로드
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PortableObsidian_Windows.zip
            PortableObsidian_Linux.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
